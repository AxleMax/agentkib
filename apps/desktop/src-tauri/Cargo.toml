[package]
name = "agentkib-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "agentkib_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agentkib-core.workspace = true
agentkib-adapters.workspace = true
agentkib-discovery.workspace = true
agentkib-insights.workspace = true
agentkib-gateways.workspace = true
agentkib-mcp.workspace = true
agentkib-store.workspace = true
anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile.workspace = true
