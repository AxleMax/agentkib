[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/agentkib-core",
  "crates/agentkib-adapters",
  "crates/agentkib-discovery",
  "crates/agentkib-insights",
  "crates/agentkib-store",
  "crates/agentkib-cli",
  "crates/agentkib-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
agentkib-core = { path = "crates/agentkib-core" }
agentkib-adapters = { path = "crates/agentkib-adapters" }
agentkib-discovery = { path = "crates/agentkib-discovery" }
agentkib-insights = { path = "crates/agentkib-insights" }
agentkib-store = { path = "crates/agentkib-store" }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
hex = "0.4"
json5 = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
toml = "0.9"
uuid = { version = "1.17", features = ["v4", "serde"] }
walkdir = "2.5"
